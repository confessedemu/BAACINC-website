name: Link check

on:
  pull_request:
  push:
  schedule:
    - cron: "30 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lychee:
    name: Check links
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check links
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          fail: false
          format: markdown
          output: lychee/out.md
          args: --config lychee.toml --verbose --no-progress

      - name: Open an issue if links failed
        if: steps.lychee.outputs.exit_code != 0 && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const title = "Link check failed";
            let report = "";
            try {
              report = fs.readFileSync("lychee/out.md", "utf8");
            } catch (err) {
              report = "Lychee did not write a report file.";
            }
            const body = (
              "The link check found a problem.\n\n" +
              "Run: `" + context.serverUrl + "/" + context.repo.owner + "/" + context.repo.repo + "/actions/runs/" + context.runId + "`\n\n" +
              report
            ).slice(0, 60000);
            const { owner, repo } = context.repo;
            const existing = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: "open",
              per_page: 50
            });
            const found = existing.data.find((issue) => issue.title === title && !issue.pull_request);
            if (found) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: found.number,
                body
              });
            } else {
              await github.rest.issues.create({
                owner,
                repo,
                title,
                body
              });
            }

      - name: Fail the check when links are broken
        if: steps.lychee.outputs.exit_code != 0
        run: exit 1
