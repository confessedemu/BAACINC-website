# Prepared only. This workflow does not enable GitHub Pages.
# The owner turns Pages on later, in Settings → Pages → Source: GitHub Actions.
# configure-pages is left at its default, which does not enable Pages.

name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Assemble the site
        run: |
          mkdir -p _site
          cp index.html 404.html robots.txt sitemap.xml CNAME _site/
          cp -R css js assets _site/

      - name: Configure Pages
        uses: actions/configure-pages@v6
        with:
          enablement: false

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
